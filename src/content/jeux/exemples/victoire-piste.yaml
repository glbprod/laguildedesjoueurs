# Une piste à deux sens seule. casesTotal = 1 + 2 × (1 + 2 + 1 extrémité) = 9.
type: victoire
titre: Exemple de piste
validation:
  statut: brouillon
  source: exemple technique
conditions:
  - id: course
    titre: Piste d'exemple
    description: "Exemple : un marqueur que chaque camp pousse vers l'extrémité adverse."
    suivi:
      type: piste
      camps: [j1, j2]
      casesTotal: 9
      pointsCentre: 0
      zones:
        - id: A
          cases: 1
          points: 1
        - id: B
          cases: 2
          points: 3
          jeton:
            valeur: 1
      action: Avancée
      messages:
        centre: "Marqueur au centre : 0 point."
        zone: "Marqueur à {cases} du centre, côté {cote}, zone {zone} : {points} points pour {leader}."
        extremite: "Marqueur à l'extrémité de {perdant} : {gagnant} gagne."
        jeton: "{perdant} subit l'effet du jeton ({valeur}). Le jeton est retiré."
        victoire: "Le marqueur atteint l'extrémité de {perdant} : {gagnant} gagne."
        annule: "Dernière action annulée."
