<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Châteaux de Bourgogne — Aide de jeu</title>
<!-- Aucune ressource tierce : les polices ci-dessous ne sont utilisées que si elles sont installées,
     sinon la pile de repli prend le relais. Fontsource les fournira à l'intégration Astro. -->
<style>
/* ===== THÈME « parchemin et bordeaux » : tokens uniquement =====
   Ce bloc deviendra src/styles/themes/chateaux.css à l'intégration. */
:root{
  --parchemin:#f0e8d6;
  --parchemin-fonce:#e5dac0;
  --parchemin-creux:#cdbf9a;
  --encre:#2a2420;
  --encre-pale:#54483f;
  --accent:#5b1a2b;        /* bordeaux */
  --danger:#8c2f1b;
  --j1:#1d4a73;
  --j2:#a0521d;
  /* types de tuiles : repères visuels, jamais seul porteur d'information (le nom est toujours écrit) */
  --t-vert-clair:#8cc063;
  --t-vert-fonce:#2f6b3a;
  --t-jaune:#e2b82c;
  --t-beige:#d9c39a;
  --t-bleu:#3b7fc4;
  --t-gris:#8a9096;
  /* pictogrammes */
  --face-de:#fbf6e8;
  --piece:#d9a82b;
  --ouvrier:#8a5a2b;
}

/* ===== COMPOSANTS (mêmes composants que les autres aides de jeu) ===== */
*{box-sizing:border-box}
body{
  margin:0;padding:0 0 4rem;
  background:var(--parchemin);color:var(--encre);
  font-family:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:18px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,summary{touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible,.coche:focus-within{outline:3px solid var(--j2);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 1.1rem}

header{padding:2rem 0 .8rem;text-align:center}
.eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
h1{
  font-family:'IM Fell English SC',Georgia,'Times New Roman',serif;font-weight:400;
  font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.15;margin:.5rem 0 .3rem;
}
.sous{font-size:.9rem;color:var(--encre-pale)}
.filet{height:1px;background:var(--encre);opacity:.35;margin:1.1rem 0 0}

nav{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:1.3rem 0}
.tab{
  min-height:3.6rem;background:transparent;border:1px solid var(--parchemin-creux);border-radius:4px;
  padding:.5rem .2rem;cursor:pointer;color:var(--encre-pale);font-family:inherit;text-align:center;
  transition:background .18s,color .18s,border-color .18s;
}
.tab .num{display:block;font-family:'IM Fell English SC',Georgia,serif;font-size:1.15rem}
.tab .lib{display:block;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;margin-top:.1rem}
.tab[aria-selected="true"]{background:var(--encre);border-color:var(--encre);color:var(--parchemin)}
section[hidden]{display:none}
@media (min-width:700px){nav{grid-template-columns:repeat(6,1fr)}}

h2{
  font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.3rem;
  margin:1.9rem 0 .6rem;padding-bottom:.25rem;border-bottom:1px solid var(--parchemin-creux);
}
h2:first-child{margin-top:.2rem}
h3{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.15rem;margin:0 0 .15rem}
h4{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.05rem;margin:.9rem 0 .2rem}
p{margin:.45rem 0}
.note{color:var(--encre-pale);font-size:.9rem}
b,strong{font-weight:700}
.ref{font:500 .7rem 'Karla',system-ui,sans-serif;letter-spacing:.08em;color:var(--encre-pale);margin-left:.6rem;vertical-align:middle}

.bloc{background:var(--parchemin-fonce);border-radius:4px;padding:.9rem 1rem}
.bloc + .bloc{margin-top:.6rem}

ul.check{list-style:none;padding:0;margin:.3rem 0 0}
ul.check li{padding:.4rem 0 .4rem 1.4rem;position:relative;border-bottom:1px solid var(--parchemin-creux)}
ul.check li:last-child{border-bottom:0}
ul.check li::before{content:"›";position:absolute;left:.2rem;color:var(--accent);font-weight:700;top:.35rem}
ul.check.sans-puce li{padding-left:0}
ul.check.sans-puce li::before{content:none}

.course{background:var(--parchemin-fonce);border-radius:4px;padding:1rem;margin-bottom:.9rem}
.course .quoi{font-size:.9rem;color:var(--encre-pale);margin-bottom:.8rem}

.rangee{display:flex;align-items:center;justify-content:center;gap:.5rem}
.pas{
  width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--encre-pale);
  background:transparent;color:var(--encre);font-size:1.5rem;line-height:1;cursor:pointer;font-family:inherit;padding:0;
}
.pas:disabled{opacity:.25;cursor:default}
.val{font-size:1.6rem;font-weight:700;min-width:1.7ch;text-align:center}
.saisie{
  width:3.7rem;height:44px;font:700 1.4rem 'Karla',system-ui,sans-serif;text-align:center;color:var(--encre);
  background:var(--parchemin);border:1px solid var(--encre-pale);border-radius:4px;-moz-appearance:textfield;appearance:textfield;
}
.saisie::-webkit-outer-spin-button,.saisie::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.alerte{margin-top:.7rem;padding:.6rem .8rem;border-radius:4px;background:var(--parchemin-creux)}
.alerte.chaud{background:var(--danger);color:var(--parchemin)}
.alerte.gagne{background:var(--encre);color:var(--parchemin);font-weight:700}
.alerte:empty{display:none}

.btn{
  min-height:44px;background:transparent;border:1px solid var(--encre-pale);border-radius:4px;color:var(--encre);
  padding:.5rem 1.2rem;font-family:inherit;font-size:.95rem;cursor:pointer;
}
.btn:disabled{opacity:.35;cursor:default}
.btn.confirme{background:var(--danger);border-color:var(--danger);color:var(--parchemin);font-weight:700}
.remise{margin-top:1.6rem;text-align:center}

.badge{display:inline-block;margin-left:.4rem;padding:0 .45rem;border:1px solid var(--accent);border-radius:3px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);vertical-align:middle;font-weight:500}
footer{text-align:center;color:var(--encre-pale);font-size:.72rem;letter-spacing:.09em;margin-top:2.5rem;text-transform:uppercase}

/* ----- spécifique à cette page ----- */
.j1{color:var(--j1)} .j2{color:var(--j2)}
.puce-joueur{display:inline-block;padding:0 .5rem;border-radius:3px;color:var(--parchemin);font-weight:700;font-size:.9em}
.puce-joueur.j1{background:var(--j1)} .puce-joueur.j2{background:var(--j2)}

.picto{width:1.3em;height:1.3em;vertical-align:-.28em;margin-right:.25em;flex:none}

.coche{display:flex;align-items:center;gap:.8rem;min-height:48px;cursor:pointer;padding:.15rem 0}
.coche input{width:28px;height:28px;flex:none;accent-color:var(--accent);margin:0}
.coche input:checked + span{opacity:.55}

/* textes de règle : étapes numérotées, tableaux, exemples */
ol.etapes-regle{margin:.4rem 0 0;padding-left:1.7rem}
ol.etapes-regle > li{padding:.3rem 0 .3rem .2rem}
ol.etapes-regle > li::marker{font-weight:700;color:var(--accent)}
ol.etapes-regle ul{margin:.25rem 0 .1rem;padding-left:1.1rem}
ol.etapes-regle ul li{padding:.1rem 0}
.exemple{border-left:3px solid var(--accent);padding-left:.8rem;margin:.7rem 0 .2rem}
table.donnees{width:100%;border-collapse:collapse;font-size:.95rem;margin:.5rem 0}
.donnees th,.donnees td{padding:.5rem .6rem;border-bottom:1px solid var(--parchemin-creux);text-align:left;vertical-align:top}
.donnees th{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--encre-pale);font-weight:700}
.donnees td.num{font-weight:700;white-space:nowrap}
.donnees td.centre,.donnees th.centre{text-align:center}
.donnees tr:last-child td{border-bottom:0}
.donnees .actuel{background:var(--accent);color:var(--parchemin);font-weight:700}

/* points non réglés par le livret : toujours visibles, jamais comblés */
.trou{border:2px dashed var(--encre-pale);border-radius:4px;padding:.55rem .8rem;margin:.6rem 0;background:var(--parchemin)}
.trou .etiquette{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--danger)}
.trou .sujet{font-weight:700}
.trou p{margin:.25rem 0;font-size:.92rem}
.precision{border-left:4px solid var(--parchemin-creux);padding:.15rem 0 .15rem .8rem;margin:.7rem 0 .2rem;font-size:.92rem}

.sauts{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.2rem 0 .6rem}
.sauts .btn{padding:.4rem .3rem;font-size:.9rem}

.commandes{display:grid;grid-template-columns:1fr 2fr;gap:.5rem;margin-top:.7rem}
.commandes .btn{min-height:56px;font-size:1.05rem}
.commandes .btn.primaire{background:var(--accent);border-color:var(--accent);color:var(--parchemin);font-weight:700}

/* outil A : suivi de la partie */
.suivi-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.suivi-case{background:var(--parchemin);border-radius:4px;padding:.5rem .4rem;text-align:center}
.suivi-case .rang{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-pale)}
.suivi-case .gros-chiffre{display:block;font:400 2.6rem/1.1 'IM Fell English SC',Georgia,serif}
.suivi-case .petit{font-size:.85rem;color:var(--encre-pale)}
.frise{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin:.6rem 0 0}
.frise span{text-align:center;padding:.25rem 0;border:1px solid var(--parchemin-creux);border-radius:4px;font-size:.85rem;color:var(--encre-pale)}
.frise span[aria-current="step"]{background:var(--encre);border-color:var(--encre);color:var(--parchemin);font-weight:700}
.etape-fin{background:var(--parchemin);border:2px solid var(--accent);border-radius:4px;padding:.7rem 1rem;margin-top:.7rem}
.etape-fin h4{margin:.1rem 0 .3rem;color:var(--accent)}
.etape-fin ul{list-style:none;margin:0;padding:0}
.etape-fin li{padding:.25rem 0}
.etape-fin .btn{margin-top:.5rem;width:100%}

/* outil B : zone complète */
.phases-zone{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin:.4rem 0 .7rem}
.bascule{
  min-height:48px;background:transparent;border:1px solid var(--encre-pale);border-radius:4px;color:var(--encre);
  font-family:inherit;font-size:.95rem;cursor:pointer;padding:.4rem .6rem;width:100%;
}
.bascule[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--parchemin);font-weight:700}
.zone-ligne{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.resultat{margin-top:.8rem;padding:.7rem 1rem;border-radius:4px;background:var(--accent);color:var(--parchemin)}
.resultat .grand{font-size:2rem;font-weight:700;line-height:1.2}
.resultat .detail{font-size:.95rem}
.etiquette-champ{font-weight:700;margin:.2rem 0}

/* recherche de Monastère */
.mon-resultat{margin-top:.8rem;padding:.8rem 1rem;border-radius:4px;background:var(--parchemin);border:2px solid var(--accent)}
.mon-resultat:empty{display:none}
.mon-resultat .numero{font:400 2rem/1.1 'IM Fell English SC',Georgia,serif;color:var(--accent)}
.mon-resultat .groupe{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-pale);margin-left:.6rem}
.mon-resultat .texte{font-size:1.1rem;margin:.3rem 0}
.liste-bat{display:grid;grid-template-columns:1fr 1fr;gap:.2rem .8rem;list-style:none;padding:0;margin:.4rem 0 0;font-size:.92rem}

/* outil C : décompte final */
.grille-civil{display:grid;gap:.4rem .6rem;align-items:center;grid-template-columns:minmax(7rem,1fr) auto auto}
.grille-civil .entete{font-weight:700;text-align:center;font-size:.95rem}
.grille-civil .lib-cat{display:flex;align-items:center;gap:.5rem;font-weight:500}
.grille-civil .lib-cat .barre{width:5px;align-self:stretch;min-height:1.6rem;border-radius:2px;background:var(--parchemin-creux)}
.grille-civil .petit{display:block;font-size:.75rem;color:var(--encre-pale);font-weight:400}
.cellule{text-align:center}
.cellule .auto{font-size:1.6rem;font-weight:700;display:block;min-height:44px;line-height:44px}
.cellule .conv{font-size:.8rem;color:var(--encre-pale);display:block}
.ligne-total{display:contents}
.ligne-total > *{border-top:2px solid var(--encre);padding-top:.5rem;margin-top:.3rem}
.ligne-total .gros-total{font-size:2rem;font-weight:700;text-align:center;line-height:1.1}
details.sous-decompte{grid-column:1/-1;background:var(--parchemin);border-radius:4px;padding:0 .8rem}
details.sous-decompte summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;cursor:pointer;font-weight:700}
details.sous-decompte .grille-civil{margin:.2rem 0 .8rem}
.choix-joueur{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.4rem}

details.repere{margin:.8rem 0 .9rem;background:var(--parchemin-fonce);border-radius:4px;padding:0 1rem}
details.repere summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700}
details.repere > div{padding-bottom:.8rem}

@media (max-width:560px){
  body{font-size:17px}
  .grille-civil{grid-template-columns:auto auto}
  .grille-civil .lib-cat{grid-column:1/-1;margin-top:.5rem}
  .ligne-total .lib-cat{grid-column:1/-1}
  .suivi-case .gros-chiffre{font-size:2.2rem}
  .liste-bat{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}

/* lien vers la grille d'observation : discret, mais avec une cible de 44 px */
.lien-grille{text-align:center;margin:.3rem 0 0}
.lien-grille a{display:inline-block;min-height:44px;line-height:44px;padding:0 .8rem;font-size:.8rem;color:var(--encre-pale)}

/* mode ?test */
#tests{margin-top:2rem;padding:1rem;border:2px dashed var(--encre-pale);border-radius:4px;font-size:.85rem}
#tests li.ok::marker{content:"✔ "} #tests li.echec{color:var(--danger);font-weight:700}
#tests li.echec::marker{content:"✘ "} #tests li.info{color:var(--encre-pale)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="titreJeu"></h1>
  <div class="sous" id="sousTitre"></div>
  <div class="filet"></div>
</header>

<noscript><p class="trou">Cette aide de jeu a besoin de JavaScript.</p></noscript>

<nav role="tablist" aria-label="Rubriques">
  <button class="tab" role="tab" id="t1" aria-controls="p1" aria-selected="true"><span class="num">I</span><span class="lib">Mise en place</span></button>
  <button class="tab" role="tab" id="t2" aria-controls="p2" aria-selected="false" tabindex="-1"><span class="num">II</span><span class="lib">Tour de jeu</span></button>
  <button class="tab" role="tab" id="t3" aria-controls="p3" aria-selected="false" tabindex="-1"><span class="num">III</span><span class="lib">Actions</span></button>
  <button class="tab" role="tab" id="t4" aria-controls="p4" aria-selected="false" tabindex="-1"><span class="num">IV</span><span class="lib">Tuiles</span></button>
  <button class="tab" role="tab" id="t5" aria-controls="p5" aria-selected="false" tabindex="-1"><span class="num">V</span><span class="lib">Monastères</span></button>
  <button class="tab" role="tab" id="t6" aria-controls="p6" aria-selected="false" tabindex="-1"><span class="num">VI</span><span class="lib">Points</span></button>
</nav>

<section id="p1" role="tabpanel" aria-labelledby="t1" tabindex="0"></section>
<section id="p2" role="tabpanel" aria-labelledby="t2" tabindex="0" hidden></section>
<section id="p3" role="tabpanel" aria-labelledby="t3" tabindex="0" hidden></section>
<section id="p4" role="tabpanel" aria-labelledby="t4" tabindex="0" hidden></section>
<section id="p5" role="tabpanel" aria-labelledby="t5" tabindex="0" hidden></section>
<section id="p6" role="tabpanel" aria-labelledby="t6" tabindex="0" hidden></section>

<div class="remise"><button class="btn" id="nouvelle" type="button">Nouvelle partie</button></div>
<footer id="pied"></footer>
<p class="lien-grille"><a href="chateaux_grille-observation_v1.html">Grille d'observation (partie test)</a></p>
<div id="tests" hidden></div>
</div>

<!-- ===== DONNÉES : JSON strict, prêt à migrer en content collection Zod =====
     Les textes de règle sont ceux de chateaux_regles_v1.md (sections validées), découpés mais non réécrits.
     **gras** et {{hex:bleu}} {{de:4}} {{piece}} {{ouvrier}} sont interprétés par l'affichage.
     Périmètre : jeu de base, 2 joueurs. Les valeurs à 3 et 4 joueurs ne sont volontairement pas reprises. -->

            ["Animaux (vert clair)", "28", "7 × 4 ; 8 à dos noir"],
            ["Monastères (jaune)", "26", "tous différents ; 6 à dos noir"],

            ["Pièces", "24", ""],
            ["Ouvriers", "26", ""],

      "plateauJeu": {

<script>
(function(){
"use strict";

/* ================================================================== */
/* Données et constantes                                               */
/* ================================================================== */

const D = JSON.parse(document.getElementById('donnees').textContent);
const CLE = 'guilde:chateaux:partie';
const JOUEURS = D.jeu.camps.map(c => c.id);
const nom = id => D.jeu.camps.find(c => c.id === id).nom;
const autre = id => (id === 'j1' ? 'j2' : 'j1');
const MEP = D.miseEnPlace, TOUR = D.tour, SUIVI = D.tour.suivi, MON = D.monasteres, PTS = D.points, DEC = D.decompte;
const PHASES = SUIVI.phases;
const BAREME = PTS.zone.bareme;
const ONGLETS = ['t1', 't2', 't3', 't4', 't5', 't6'];
// Une phase = 5 tours + la fin de phase ; au-delà du dernier pas, la partie est terminée.
const PAS_PAR_PHASE = SUIVI.tours + 1;
const PAS_MAX = PHASES.length * PAS_PAR_PHASE;
const COULEURS_HEX = ['vert-clair', 'vert-fonce', 'jaune', 'beige', 'bleu', 'gris'];

const gab = (t, v) => t.replace(/\{(\w+)\}/g, (m, k) => (v[k] !== undefined ? v[k] : m));
const borner = (v, min, max) => Math.max(min, Math.min(max, v));
const somme = tab => tab.reduce((a, n) => a + n, 0);

/* ================================================================== */
/* Logique pure (testée en mode ?test)                                 */
/* ================================================================== */

// --- Outil A : suivi. Le pas 0 est le tour 1 de la phase A ; le pas 30 est la partie terminée.
function positionSuivi(pas) {
  const n = borner(Math.trunc(Number.isFinite(pas) ? pas : 0), 0, PAS_MAX);
  if (n === PAS_MAX) return { etape: 'terminee', phase: PHASES[PHASES.length - 1], tour: null };
  const phase = PHASES[Math.floor(n / PAS_PAR_PHASE)], reste = n % PAS_PAR_PHASE;
  return reste < SUIVI.tours ? { etape: 'tour', phase, tour: reste + 1 } : { etape: 'fin', phase, tour: null };
}
const suivantSuivi = pas => Math.min(PAS_MAX, pas + 1);
const precedentSuivi = pas => Math.max(0, pas - 1);
function bonusDePhase(phase) {
  const b = PTS.zone.bonusPhase.find(x => x.phase === phase);
  return b ? b.bonus : null;
}

// --- Outil B : PV d'une zone complète = barème de taille + bonus de la phase.
function pointsZone(taille, phase) {
  if (!Number.isInteger(taille) || taille < 1 || taille > BAREME.length) return null;
  const bonus = bonusDePhase(phase);
  if (bonus === null) return null;
  return { taille: BAREME[taille - 1], phase: bonus, total: BAREME[taille - 1] + bonus };
}
// La phase du suivi sert de valeur par défaut ; une phase saisie à la main la remplace.
const phaseEffective = (phaseSuivi, surcharge) => (PHASES.includes(surcharge) ? surcharge : phaseSuivi);

// --- Outil C : décompte final à 2 joueurs.
function decompteJoueur(s) {
  const V = DEC.valeurs;
  const lignes = {
    pieces: s.pieces * V.piece,
    invendues: s.invendues * V.invendue,
    ouvriers: Math.floor(s.ouvriers / V.ouvriersParPoint),
    m15: s.m15 * V.m15,
    m16a23: somme(s.m16a23) * V.m16a23,
    m24: s.m24 * V.m24,
    m25: s.m25 * V.m25,
    m26: s.m26 * V.m26
  };
  const fin = somme(Object.values(lignes));
  return { lignes, fin, total: s.piste + fin };
}
// Égalité de points → moins de cases vides → joueur devant sur le pont.
function departager(a, b, pont) {
  if (a.total !== b.total) return { gagnant: a.total > b.total ? 'j1' : 'j2', raison: 'points' };
  if (a.casesVides !== b.casesVides) return { gagnant: a.casesVides < b.casesVides ? 'j1' : 'j2', raison: 'casesVides' };
  if (pont === 'j1' || pont === 'j2') return { gagnant: pont, raison: 'pont' };
  return { gagnant: null, raison: 'pontASaisir' };
}

// --- Recherche de Monastère par numéro. Aucun nom de bâtiment hors de ceux que le livret identifie.
function chercherMonastere(n) {
  if (!Number.isInteger(n) || n < 1 || n > MON.total) return null;
  const regle = MON.regles.liste.find(m => m.n === n);
  if (regle) return { numero: n, groupe: 'regles', texte: regle.texte, trou: regle.trou || null, aConfirmer: null, batiment: null, batimentAIdentifier: false };
  const fin = MON.fin.liste.find(m => m.numeros.includes(n));
  if (!fin) return null;
  const batiment = fin.numeros.length > 1 ? (MON.batiments[n] || null) : null;
  const dansGroupeBatiments = fin.numeros.length > 1;
  return {
    numero: n, groupe: 'fin', texte: fin.texte,
    // Le trou des n° 16 à 23 ne concerne que les numéros dont le livret ne donne pas le bâtiment.
    trou: dansGroupeBatiments && batiment ? null : (fin.trou || null),
    aConfirmer: fin.aConfirmer || null,
    batiment, batimentAIdentifier: dansGroupeBatiments && !batiment
  };
}

// --- Domaine (données de test) : découpage en zones de même couleur qui se touchent.
// Pour une case d'indice c sur une ligne de n cases, la position horizontale est p = 2c + (nMax − n).
function decouperDomaine(texte) {
  const rangees = texte.trim().split('\n').map(l => l.trim().replace(/^L\d+:\s*/, '').split(/\s+/));
  const nMax = Math.max(...rangees.map(r => r.length));
  const cases = [];
  rangees.forEach((r, y) => r.forEach((code, c) => cases.push({
    id: cases.length, y, c, p: 2 * c + (nMax - r.length), couleur: code[0], de: Number(code.slice(1))
  })));
  const voisines = (a, b) => (a.y === b.y && Math.abs(a.p - b.p) === 2) || (Math.abs(a.y - b.y) === 1 && Math.abs(a.p - b.p) === 1);
  const vues = new Set(), zones = [];
  cases.forEach(depart => {
    if (vues.has(depart.id)) return;
    const membres = [depart];
    vues.add(depart.id);
    for (let i = 0; i < membres.length; i++) {
      cases.forEach(o => {
        if (!vues.has(o.id) && o.couleur === membres[i].couleur && voisines(membres[i], o)) { vues.add(o.id); membres.push(o); }
      });
    }
    zones.push({ couleur: depart.couleur, cases: membres.map(m => m.id) });
  });
  return { rangees: rangees.map(r => r.length), cases, zones, voisines };
}

// --- État : tout ce qui n'a pas la forme attendue retombe sur la valeur par défaut.
function normaliser(def, brut) {
  if (Array.isArray(def)) {
    if (!Array.isArray(brut)) return def;
    return def.map((d, i) => normaliser(d, brut[i]));
  }
  if (def && typeof def === 'object') {
    const src = brut && typeof brut === 'object' ? brut : {};
    const sortie = {};
    Object.keys(def).forEach(k => { sortie[k] = normaliser(def[k], src[k]); });
    return sortie;
  }
  if (typeof def === 'number') return Number.isFinite(brut) ? brut : def;
  if (typeof def === 'boolean') return typeof brut === 'boolean' ? brut : def;
  if (typeof def === 'string') return typeof brut === 'string' ? brut : def;
  return def;
}

/* ================================================================== */
/* État de partie                                                      */
/* ================================================================== */

// Une tuile Monastère par type de bâtiment (n° 16 à 23) : un compteur de bâtiments par tuile.
const NB_TUILES_BATIMENT = MON.fin.liste.find(m => m.numeros.length > 1).numeros.length;
const MAX_LIGNE = Object.fromEntries(DEC.lignes.filter(l => l.max).map(l => [l.id, l.max]));

function etatDefaut() {
  const joueur = () => ({
    piste: 0, pieces: 0, invendues: 0, ouvriers: 0, m15: 0,
    m16a23: new Array(NB_TUILES_BATIMENT).fill(0),
    m24: 0, m25: 0, m26: 0, casesVides: 0
  });
  return {
    v: 1,
    onglet: 't1',
    checklist: Object.fromEntries(MEP.checklists.flatMap(g => g.points.map((p, i) => [g.id + '-' + i, false]))),
    suivi: 0,
    zone: { taille: 1, phase: '' },
    monastere: 0,
    decompte: { j1: joueur(), j2: joueur(), pont: '' },
    // Jamais enregistré : valeurs propres à un instant de la partie.
    transitoire: { confirmation: false }
  };
}

function assainir(e) {
  e.suivi = borner(Math.round(e.suivi), 0, PAS_MAX);
  e.zone.taille = borner(Math.round(e.zone.taille), 1, BAREME.length);
  // La phase propre à l'outil B n'est pas reprise d'une session à l'autre : elle repart de celle du suivi.
  e.zone.phase = '';
  e.monastere = borner(Math.round(e.monastere), 0, MON.total);
  JOUEURS.forEach(j => {
    const d = e.decompte[j];
    Object.keys(MAX_LIGNE).forEach(k => { if (k in d) d[k] = borner(Math.round(d[k]), 0, MAX_LIGNE[k]); });
    d.m16a23 = d.m16a23.map(n => borner(Math.round(n), 0, DEC.maxBatiments));
    d.casesVides = borner(Math.round(d.casesVides), 0, DEC.departage.maxCases);
  });
  if (!['', 'j1', 'j2'].includes(e.decompte.pont)) e.decompte.pont = '';
  if (!ONGLETS.includes(e.onglet)) e.onglet = 't1';
  return e;
}

function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) {
      const o = JSON.parse(brut);
      if (o && o.v === 1) return assainir(normaliser(etatDefaut(), o));
    }
  } catch (e) { /* stockage vide, illisible ou indisponible : on repart d'une partie neuve */ }
  return etatDefaut();
}

function sauver() {
  try {
    const copie = Object.assign({}, etat);
    delete copie.transitoire;
    localStorage.setItem(CLE, JSON.stringify(copie));
  } catch (e) { /* stockage indisponible : la partie reste jouable en mémoire */ }
}

let etat = charger();

const lire = chemin => chemin.split('.').reduce((o, k) => o[k], etat);
function ecrire(chemin, valeur) {
  const cles = chemin.split('.');
  const dernier = cles.pop();
  cles.reduce((o, k) => o[k], etat)[dernier] = valeur;
}

/* ================================================================== */
/* Outils DOM                                                          */
/* ================================================================== */

function h(tag, attrs, ...enfants) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    e.setAttribute(k, v === true ? '' : v);
  });
  enfants.flat(Infinity).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    e.append(typeof c === 'object' ? c : document.createTextNode(c));
  });
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...enfants) {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
  enfants.flat(Infinity).forEach(c => { if (c) e.append(c); });
  return e;
}
// Element.append convertirait un tableau en texte : on aplatit d'abord.
function ajouter(parent, ...enfants) {
  enfants.flat(Infinity).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    parent.append(typeof c === 'object' ? c : document.createTextNode(c));
  });
  return parent;
}

/* --- pictogrammes originaux : hexagone de la couleur du type, face de dé, pièce, ouvrier --- */
const PIPS = {
  1: [[12, 12]],
  2: [[7, 7], [17, 17]],
  3: [[7, 7], [12, 12], [17, 17]],
  4: [[7, 7], [17, 7], [7, 17], [17, 17]],
  5: [[7, 7], [17, 7], [12, 12], [7, 17], [17, 17]],
  6: [[7, 6.5], [17, 6.5], [7, 12], [17, 12], [7, 17.5], [17, 17.5]]
};
function picto(spec) {
  const [type, arg] = spec.split(':');
  const svg = sv('svg', { class: 'picto', viewBox: '0 0 24 24', 'aria-hidden': 'true', focusable: 'false' });
  if (type === 'hex' && COULEURS_HEX.includes(arg)) {
    svg.append(sv('polygon', { points: '12,1.5 21.5,7 21.5,17 12,22.5 2.5,17 2.5,7', fill: 'var(--t-' + arg + ')', stroke: 'var(--encre)', 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
  } else if (type === 'de') {
    const n = PIPS[arg] ? arg : 5;
    svg.append(sv('rect', { x: 2, y: 2, width: 20, height: 20, rx: 4, fill: 'var(--face-de)', stroke: 'var(--encre)', 'stroke-width': 1.5 }),
      ...PIPS[n].map(([x, y]) => sv('circle', { cx: x, cy: y, r: 1.9, fill: 'var(--encre)' })));
  } else if (type === 'piece') {
    svg.append(sv('circle', { cx: 12, cy: 12, r: 9.5, fill: 'var(--piece)', stroke: 'var(--encre)', 'stroke-width': 1.5 }),
      sv('circle', { cx: 12, cy: 12, r: 5.6, fill: 'none', stroke: 'var(--encre)', 'stroke-width': 1.2 }));
  } else if (type === 'ouvrier') {
    svg.append(sv('circle', { cx: 12, cy: 6.8, r: 4.2, fill: 'var(--ouvrier)', stroke: 'var(--encre)', 'stroke-width': 1.4 }),
      sv('path', { d: 'M4.5 22 C4.5 15.5 8 12.6 12 12.6 C16 12.6 19.5 15.5 19.5 22 Z', fill: 'var(--ouvrier)', stroke: 'var(--encre)', 'stroke-width': 1.4, 'stroke-linejoin': 'round' }));
  } else return document.createTextNode('');
  return svg;
}
// **gras** et {{pictogramme}} dans les textes des données
function riche(t) {
  return String(t).split(/(\*\*.+?\*\*|\{\{.+?\}\})/).map(p => {
    if (/^\*\*.+\*\*$/.test(p)) return h('strong', {}, p.slice(2, -2));
    if (/^\{\{.+\}\}$/.test(p)) return picto(p.slice(2, -2));
    return p;
  });
}
const badge = texte => h('span', { class: 'badge' }, texte);
const puce = j => h('span', { class: 'puce-joueur ' + j }, nom(j));

function stepper(chemin, libelle, min = 0, max = 99) {
  const data = d => ({ 'data-pas': chemin, 'data-d': d, 'data-min': min, 'data-max': max });
  return h('div', { class: 'rangee', role: 'group', 'aria-label': libelle },
    h('button', Object.assign({ class: 'pas', type: 'button', 'aria-label': 'Diminuer : ' + libelle }, data(-1)), '−'),
    h('span', { class: 'val', 'data-lit': chemin }),
    h('button', Object.assign({ class: 'pas', type: 'button', 'aria-label': 'Augmenter : ' + libelle }, data(1)), '+'));
}
function saisie(chemin, libelle, max, videSiZero) {
  const data = d => ({ 'data-pas': chemin, 'data-d': d, 'data-min': 0, 'data-max': max });
  return h('div', { class: 'rangee', role: 'group', 'aria-label': libelle },
    h('button', Object.assign({ class: 'pas', type: 'button', 'aria-label': 'Diminuer : ' + libelle }, data(-1)), '−'),
    h('input', { class: 'saisie', type: 'number', inputmode: 'numeric', min: 0, max, 'data-saisie': chemin, 'data-vide-zero': videSiZero ? '1' : null, 'aria-label': libelle }),
    h('button', Object.assign({ class: 'pas', type: 'button', 'aria-label': 'Augmenter : ' + libelle }, data(1)), '+'));
}

/* --- éléments génériques pilotés par les données --- */
function tableau(t) {
  return h('table', { class: 'donnees' },
    h('thead', {}, h('tr', {}, t.entetes.map(e => h('th', { scope: 'col' }, e)))),
    h('tbody', {}, t.lignes.map(l => h('tr', {}, l.map((c, i) => (i === 0 && t.premiereColonne !== false && /^\d/.test(c)
      ? h('td', { class: 'num' }, riche(c)) : h('td', {}, riche(c))))))));
}
function trou(t) {
  return h('div', { class: 'trou', role: 'note' },
    h('span', { class: 'etiquette' }, D.jeu.etiquetteTrou),
    h('p', {}, h('span', { class: 'sujet' }, t.sujet), ' — ', riche(t.texte[0])),
    t.texte.slice(1).map(p => h('p', {}, riche(p))));
}
const precision = p => h('div', { class: 'precision' }, riche(p.texte), p.badge ? badge(p.badge) : null);
function bloc(b) {
  return h('div', { class: 'bloc' },
    b.titre ? h('h3', {}, b.titre, b.ref ? h('span', { class: 'ref' }, b.ref) : null) : null,
    (b.paragraphes || []).map(p => h('p', {}, riche(p))),
    b.etapes ? h('ol', { class: 'etapes-regle' }, b.etapes.map(e => (typeof e === 'string'
      ? h('li', {}, riche(e))
      : h('li', {}, riche(e.texte), h('ul', {}, e.sous.map(s => h('li', {}, riche(s)))))))) : null,
    (b.paragraphesApres || []).map(p => h('p', {}, riche(p))),
    b.titreListe ? h('p', {}, h('strong', {}, b.titreListe)) : null,

const qs = sel => document.querySelector(sel);
function messageNiveau(el, niveau, texte) { el.className = 'alerte' + (niveau ? ' ' + niveau : ''); el.textContent = texte || ''; }

function majGenerique() {
  document.querySelectorAll('[data-lit]').forEach(e => { e.textContent = lire(e.dataset.lit); });
  document.querySelectorAll('[data-pas]').forEach(b => {
    const v = lire(b.dataset.pas), d = Number(b.dataset.d);
    b.disabled = d < 0 ? v <= Number(b.dataset.min) : v >= Number(b.dataset.max);
  });
  document.querySelectorAll('[data-saisie]').forEach(i => {
    const v = lire(i.dataset.saisie);
    if (document.activeElement !== i) i.value = (i.dataset.videZero && v === 0) ? '' : v;
  });
  document.querySelectorAll('[data-coche]').forEach(i => { i.checked = !!etat.checklist[i.dataset.coche]; });
}

function majOnglets() {
  ONGLETS.forEach((id, i) => {
    const actif = etat.onglet === id, t = document.getElementById(id);
    t.setAttribute('aria-selected', actif ? 'true' : 'false');
    t.tabIndex = actif ? 0 : -1;
    document.getElementById('p' + (i + 1)).hidden = !actif;
  });
}

function majSuivi() {
  const L = SUIVI.libelles, pos = positionSuivi(etat.suivi);
  qs('[data-suivi="phase"]').textContent = pos.phase;
  qs('[data-suivi="tour"]').textContent = pos.etape === 'tour' ? pos.tour : '–';
  qs('[data-suivi="bonus"]').textContent = bonusDePhase(pos.phase);
  document.querySelectorAll('[data-frise-phase]').forEach(s => {
    if (s.dataset.frisePhase === pos.phase && pos.etape !== 'terminee') s.setAttribute('aria-current', 'step'); else s.removeAttribute('aria-current');
  });
  const suivant = qs('#suiviSuiv');
  suivant.disabled = pos.etape === 'terminee';
  suivant.textContent = pos.etape === 'fin' ? (pos.phase === PHASES[PHASES.length - 1] ? L.suivantFin : L.suivantPhase) : L.suivant;
  qs('#suiviPrec').disabled = etat.suivi <= 0;

  const zone = qs('#suiviFin');
  zone.replaceChildren();
  if (pos.etape === 'fin') {
    const mon2 = MON.regles.liste.find(m => m.n === 2);
    ajouter(zone, h('div', { class: 'etape-fin' },
      h('h4', {}, gab(L.finTitre, { phase: pos.phase })),
      h('ul', {},
        SUIVI.finPhase.map(t => h('li', {}, picto('piece'), t)),
        h('li', {}, picto('ouvrier'), h('strong', {}, SUIVI.finPhaseMon2), ' : ', mon2.texte, badge('déduction'))),
      h('p', { class: 'note' }, SUIVI.finPhaseDeduction)));
  } else if (pos.etape === 'terminee') {
    ajouter(zone, h('div', { class: 'etape-fin' },
      h('h4', {}, L.termineeTitre),
      h('p', {}, PTS.finPartie.paragraphes[0]),
      h('button', { class: 'btn primaire', type: 'button', 'data-action': 'aller-decompte' }, L.aller)));
  }
}

function majZone() {
  const C = PTS.calculateur, suivi = positionSuivi(etat.suivi).phase;
  const phase = phaseEffective(suivi, etat.zone.phase);
  document.querySelectorAll('[data-action="phase-zone"]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.phase === phase)));
  qs('#zoneNotePhase').textContent = phase === suivi ? gab(C.phaseSuivi, { phase: suivi }) : gab(C.phaseModifiee, { phase: suivi });
  const r = pointsZone(etat.zone.taille, phase);
  qs('#zoneResultat').replaceChildren(
    h('div', { class: 'grand' }, r.total + ' PV'),
    h('div', { class: 'detail' }, gab(C.detail, { taille: etat.zone.taille, pvTaille: r.taille, phase, pvPhase: r.phase })));
}

function majMonastere() {
  const el = qs('#monResultat'), r = chercherMonastere(etat.monastere);
  el.replaceChildren();
  if (!r) { el.append(h('p', { class: 'note' }, MON.recherche.vide)); el.style.display = 'block'; return; }
  el.style.display = '';
  ajouter(el,
    h('div', {}, h('span', { class: 'numero' }, 'n° ' + r.numero), h('span', { class: 'groupe' }, MON.groupes[r.groupe])),
    h('p', { class: 'texte' }, riche(r.texte)),
    r.batiment ? h('p', {}, picto('hex:beige'), h('strong', {}, 'Bâtiment : '), r.batiment) : null,
    r.batimentAIdentifier ? h('p', {}, picto('hex:beige'), h('strong', {}, 'Bâtiment : '), MON.batimentAIdentifier) : null,
    r.aConfirmer ? h('p', {}, badge('à confirmer'), ' ', r.aConfirmer) : null,
    r.trou ? trou(r.trou) : null);
}

function majDecompte() {
  const res = {};
  JOUEURS.forEach(j => {
    const s = etat.decompte[j], r = decompteJoueur(s);
    res[j] = { total: r.total, casesVides: s.casesVides };
    qs('[data-total="' + j + '"]').textContent = r.total;
    qs('[data-fin="' + j + '"]').textContent = r.fin;
    qs('[data-pv16="' + j + '"]').textContent = r.lignes.m16a23;
    DEC.lignes.filter(l => l.pv).forEach(l => { qs('[data-pv="' + j + '.' + l.id + '"]').textContent = '= ' + r.lignes[l.id] + ' PV'; });
  });
  document.querySelectorAll('[data-action="pont"]').forEach(b =>
    b.setAttribute('aria-pressed', String(etat.decompte.pont === b.dataset.joueur)));
  const el = qs('#verdict'), M = DEC.messages;
  if (JOUEURS.every(j => etat.decompte[j].piste === 0 && res[j].total === 0)) { messageNiveau(el, '', M.vide); return; }
  const v = departager(res.j1, res.j2, etat.decompte.pont);
  const joueur = v.gagnant ? nom(v.gagnant) : '';
  const tot = res[v.gagnant || 'j1'].total;
  if (v.raison === 'points') messageNiveau(el, 'gagne', gab(M.points, { joueur, a: tot, b: res[autre(v.gagnant)].total }));
  else if (v.raison === 'casesVides') messageNiveau(el, 'gagne', gab(M.casesVides, { joueur, a: tot, x: res[v.gagnant].casesVides, y: res[autre(v.gagnant)].casesVides }));
  else if (v.raison === 'pont') messageNiveau(el, 'gagne', gab(M.pont, { joueur, a: tot, x: res.j1.casesVides }));
  else messageNiveau(el, 'chaud', gab(M.pontASaisir, { a: tot, x: res.j1.casesVides }));
}

function majNouvelle() {
  const b = document.getElementById('nouvelle');
  b.classList.toggle('confirme', etat.transitoire.confirmation);
  b.textContent = etat.transitoire.confirmation ? 'Confirmer : tout effacer ?' : 'Nouvelle partie';
}

function actualiser() {
  majOnglets(); majGenerique(); majSuivi(); majZone(); majMonastere(); majDecompte(); majNouvelle();
}
function valider() { sauver(); actualiser(); }

let minuteurConfirmation = null;

function allerAOnglet(id) {
  // L'outil B repart de la phase du suivi à chaque ouverture de l'onglet Points ; il n'écrit jamais dans le suivi.
  if (id === 't6') etat.zone.phase = '';
  etat.onglet = id; sauver(); majOnglets(); majZone();
}

function nouvellePartie() {
  clearTimeout(minuteurConfirmation);
  try { localStorage.removeItem(CLE); } catch (e) { /* sans effet : l'état mémoire est remis à zéro */ }
  etat = etatDefaut();
  actualiser();
  window.scrollTo({ top: 0 });
}

document.addEventListener('click', ev => {
  const pas = ev.target.closest('[data-pas]');
  if (pas) {
    const chemin = pas.dataset.pas, avant = lire(chemin);
    const apres = borner(avant + Number(pas.dataset.d), Number(pas.dataset.min), Number(pas.dataset.max));
    if (apres === avant) return;
    ecrire(chemin, apres); valider();
    return;
  }
  const saut = ev.target.closest('[data-saut]');
  if (saut) { document.getElementById(saut.dataset.saut).scrollIntoView({ block: 'start' }); return; }

  const act = ev.target.closest('[data-action]');
  if (act) {
    switch (act.dataset.action) {
      case 'suivi-suiv':
        etat.suivi = suivantSuivi(etat.suivi); etat.zone.phase = ''; valider(); break;
      case 'suivi-prec':

      case 'aller-decompte':
        allerAOnglet('t6'); actualiser(); document.getElementById('decompte').scrollIntoView({ block: 'start' }); break;

        // Choisir la phase du suivi revient à le suivre de nouveau.
        etat.zone.phase = act.dataset.phase === positionSuivi(etat.suivi).phase ? '' : act.dataset.phase; valider(); break;
      case 'pont':
        etat.decompte.pont = etat.decompte.pont === act.dataset.joueur ? '' : act.dataset.joueur; valider(); break;
    }
  }
});

  verif('État : valeurs invalides → défaut', JSON.stringify(normaliser(def, { a: 'zz', b: { c: 3, d: [5, 'q'] }, e: 4 })) === JSON.stringify({ a: 1, b: { c: true, d: [5, 0] }, e: 'x' }), 'écart');
  verif('État : corps absent → défaut', JSON.stringify(normaliser(def, null)) === JSON.stringify(def), 'écart');
  const abime = assainir(normaliser(etatDefaut(), { v: 1, suivi: 99, zone: { taille: 40, phase: 'Z' }, monastere: -5, onglet: 'x', decompte: { pont: 'j3', j1: { pieces: 5000, m16a23: [99, 'a'] } } }));
  suite('État : valeurs hors limites ramenées', [abime.suivi, abime.zone.taille, abime.zone.phase, abime.monastere, abime.onglet, abime.decompte.pont, abime.decompte.j1.pieces, abime.decompte.j1.m16a23.slice(0, 2)],
    [30, 8, '', 0, 't1', '', 99, [20, 0]]);
  egal('État : par défaut, 8 compteurs de bâtiments par joueur', etatDefaut().decompte.j1.m16a23.length, 8);
  verif('État : le transitoire n\'est pas enregistré', !('transitoire' in JSON.parse((() => { const c = Object.assign({}, etatDefaut()); delete c.transitoire; return JSON.stringify(c); })())), 'enregistré');

  // --- Interface : 6 onglets, rôles ARIA, cibles tactiles d'au moins 44 px
  egal('Interface : 6 onglets', document.querySelectorAll('[role="tab"]').length, 6);
  egal('Interface : 6 panneaux reliés aux onglets', [...document.querySelectorAll('[role="tab"]')].every(t => document.getElementById(t.getAttribute('aria-controls'))), true);
  egal('Interface : un seul onglet sélectionné', document.querySelectorAll('[role="tab"][aria-selected="true"]').length, 1);
  [1, 2, 3, 4, 5, 6].forEach(n => egal('Pictogramme : dé ' + n + ' = ' + n + ' points', picto('de:' + n).querySelectorAll('circle').length, n));
  COULEURS_HEX.forEach(c => egal('Pictogramme : hexagone ' + c, picto('hex:' + c).querySelectorAll('polygon').length, 1));
  egal('Pictogramme : couleur d\'hexagone inconnue = rien', picto('hex:rose').nodeType, 3);
  egal('Pictogramme : pièce', picto('piece').querySelectorAll('circle').length, 2);
  egal('Pictogramme : ouvrier', picto('ouvrier').querySelectorAll('circle, path').length, 2);
  verif('Pictogramme : tous décoratifs (aria-hidden)', [...document.querySelectorAll('svg.picto')].every(s => s.getAttribute('aria-hidden') === 'true'), 'un pictogramme est lu');
  egal('Interface : aucun lien ni script tiers', document.querySelectorAll('link[href^="http"], script[src], img[src^="http"]').length, 0);
  const detailsOuverts = [...document.querySelectorAll('details')];
  const dejaOuverts = detailsOuverts.map(d => d.open);
  detailsOuverts.forEach(d => { d.open = true; });
  const trop = [];
  ONGLETS.forEach((id, i) => {
    const panneau = document.getElementById('p' + (i + 1)), cachait = panneau.hidden;
    panneau.hidden = false;
    panneau.querySelectorAll('button, .saisie, summary, label.coche').forEach(e => {
      const r = e.getBoundingClientRect();
      if (r.width > 0 && (r.width < 43.5 || r.height < 43.5)) trop.push(id + ' ' + (e.className || e.tagName) + ' ' + Math.round(r.width) + '×' + Math.round(r.height));
    });
    panneau.hidden = cachait;
  });
  document.querySelectorAll('.tab, #nouvelle').forEach(e => {
    const r = e.getBoundingClientRect();
    if (r.width < 43.5 || r.height < 43.5) trop.push((e.id || e.className) + ' ' + Math.round(r.width) + '×' + Math.round(r.height));
  });
  detailsOuverts.forEach((d, i) => { d.open = dejaOuverts[i]; });
  verif('Tactile : toutes les cibles font au moins 44 px', trop.length === 0, trop.slice(0, 6).join(' ; '));

  liste.append(h('li', { class: 'info' }, total + ' vérifications.'));
  const zoneTests = document.getElementById('tests');
  zoneTests.hidden = false;
  ajouter(zoneTests, h('strong', { id: 'bilanTests' }, echecs ? echecs + ' test(s) en échec sur ' + total : 'Tous les tests passent (' + total + ')'), liste);
  console.log(echecs ? 'TESTS : ' + echecs + ' échec(s) sur ' + total : 'TESTS : tout passe (' + total + ')');
}

})();
</script>
