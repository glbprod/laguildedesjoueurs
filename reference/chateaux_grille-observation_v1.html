<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Châteaux de Bourgogne — grille d'observation</title>
<!-- Aucune ressource tierce : mêmes polices de repli que l'aide de jeu. -->
<style>
/* ===== THÈME « parchemin et bordeaux » : mêmes tokens que l'aide de jeu ===== */
:root{
  --parchemin:#f0e8d6;
  --parchemin-fonce:#e5dac0;
  --parchemin-creux:#cdbf9a;
  --encre:#2a2420;
  --encre-pale:#54483f;
  --accent:#5b1a2b;
  --danger:#8c2f1b;
  --j2:#a0521d;
}

*{box-sizing:border-box}
body{
  margin:0;padding:0 0 4rem;
  background:var(--parchemin);color:var(--encre);
  font-family:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea,summary,a{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.coche:focus-within{outline:3px solid var(--j2);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 1rem}

header{padding:1.6rem 0 .6rem;text-align:center}
.eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
h1{
  font-family:'IM Fell English SC',Georgia,'Times New Roman',serif;font-weight:400;
  font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.15;margin:.4rem 0 .2rem;
}
.sous{font-size:.9rem;color:var(--encre-pale)}
.filet{height:1px;background:var(--encre);opacity:.35;margin:1rem 0 0}
code{font:.88em ui-monospace,Consolas,monospace;background:var(--parchemin-fonce);padding:0 .25em;border-radius:3px;overflow-wrap:anywhere}

/* sauts vers les 7 sections */
.sauts{
  position:sticky;top:0;z-index:10;display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;
  padding:.4rem 0;background:var(--parchemin);border-bottom:1px solid var(--parchemin-creux);margin-bottom:.4rem;
}
.sauts a{
  min-height:44px;display:grid;place-items:center;border:1px solid var(--parchemin-creux);border-radius:4px;
  color:var(--encre);text-decoration:none;font-weight:700;
}
.sauts a:active{background:var(--accent);color:var(--parchemin)}

h2{
  font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:1.3rem;line-height:1.25;
  margin:1.8rem 0 .6rem;padding-bottom:.25rem;border-bottom:1px solid var(--parchemin-creux);scroll-margin-top:4rem;
}
p{margin:.45rem 0}
.note{color:var(--encre-pale);font-size:.9rem}
.intro p{font-size:.95rem}

.bloc{background:var(--parchemin-fonce);border-radius:4px;padding:.8rem .9rem}
.bloc + .bloc{margin-top:.6rem}

.coche{display:flex;align-items:flex-start;gap:.8rem;min-height:48px;cursor:pointer;padding:.45rem 0}
.coche input{width:28px;height:28px;flex:none;accent-color:var(--accent);margin:0}
.coche input:checked + span{opacity:.6}
.point{border-bottom:1px solid var(--parchemin-creux);padding-bottom:.4rem}
.point:last-child{border-bottom:0}
.point .champs-point{margin-left:2.3rem}

/* champs */
.champ{display:block;margin:.5rem 0}
.champ .lib{display:block;font-size:.82rem;color:var(--encre-pale);margin-bottom:.15rem}
.champ input,.champ select,.champ textarea{
  width:100%;min-height:44px;padding:.5rem .6rem;font:inherit;color:var(--encre);
  background:var(--parchemin);border:1px solid var(--encre-pale);border-radius:4px;
}
.champ textarea{min-height:88px;resize:vertical}

/* choix : oui / non, livret, notes (boutons à bascule) */
.choix{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .3rem}
.choix button{
  flex:1 1 0;min-width:56px;min-height:48px;background:transparent;border:1px solid var(--encre-pale);border-radius:4px;
  color:var(--encre);font:inherit;cursor:pointer;padding:.3rem .5rem;
}
.choix button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--parchemin);font-weight:700}
.etiquette-choix{font-size:.82rem;color:var(--encre-pale);margin-top:.5rem}

/* cartes du journal, des trous et du bilan */
.cartes{display:grid;gap:.7rem;margin-top:.6rem}
.carte{background:var(--parchemin-fonce);border-radius:4px;border-left:4px solid var(--accent);padding:.5rem .9rem .6rem}
.carte-tete{display:flex;align-items:center;justify-content:space-between;gap:.6rem;min-height:44px}
.carte-tete .heure{font-variant-numeric:tabular-nums;color:var(--encre-pale);margin-left:.5rem}
.carte h3{font-size:1.05rem;margin:.3rem 0 .1rem;font-family:'IM Fell English SC',Georgia,serif;font-weight:400}

.btn{
  min-height:48px;background:transparent;border:1px solid var(--encre-pale);border-radius:4px;color:var(--encre);
  padding:.5rem 1rem;font:inherit;cursor:pointer;
}
.btn.plein{background:var(--accent);border-color:var(--accent);color:var(--parchemin);font-weight:700}
.btn.large{width:100%;margin-top:.7rem}
.btn.petit{min-height:44px;padding:.3rem .8rem;font-size:.9rem}
.btn.confirme{background:var(--danger);border-color:var(--danger);color:var(--parchemin);font-weight:700}
.btn:disabled{opacity:.35;cursor:default}

/* export */
.export{margin-top:.8rem;background:var(--parchemin-fonce);border-radius:4px;padding:.8rem .9rem}
.export textarea{
  width:100%;min-height:12rem;font:.8rem/1.4 ui-monospace,Consolas,monospace;color:var(--encre);
  background:var(--parchemin);border:1px solid var(--encre-pale);border-radius:4px;padding:.5rem;
}
.export .rangee{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.5rem}
.statut{font-weight:700;margin:0 0 .5rem}
.remise{margin-top:1.4rem}
footer{text-align:center;color:var(--encre-pale);font-size:.72rem;letter-spacing:.09em;margin-top:2.5rem;text-transform:uppercase}

/* mode ?test */
#tests{margin-top:2rem;padding:1rem;border:2px dashed var(--encre-pale);border-radius:4px;font-size:.85rem}
#tests li.ok::marker{content:"✔ "} #tests li.echec{color:var(--danger);font-weight:700}
#tests li.echec::marker{content:"✘ "} #tests li.info{color:var(--encre-pale)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="titreJeu"></h1>

  <div class="filet"></div>

<noscript><p class="bloc">Cette grille a besoin de JavaScript.</p></noscript>

<nav class="sauts" id="sauts" aria-label="Aller à la section"></nav>

<div class="remise">

  <div class="export" id="zoneExport" hidden>

    <textarea id="texteExport" readonly aria-label="Grille exportée au format Markdown" rows="12"></textarea>
    <div class="rangee">
      <button class="btn" id="copier" type="button">Copier</button>

</div>
<footer id="pied"></footer>
<div id="tests" hidden></div>
</div>

<!-- ===== DONNÉES : textes de chateaux_grille-observation_v1.md, sections 1 à 7, repris tels quels ===== -->
<script type="application/json" id="donnees">
{

    "telecharge": "Fichier téléchargé.",

<script>
(function(){
"use strict";

/* ================================================================== */
/* Données et constantes                                               */
/* ================================================================== */

const D = JSON.parse(document.getElementById('donnees').textContent);
const CLE = 'guilde:chateaux:observation';
const MAX_TEXTE = 2000, MAX_LIGNES = 200;
const J = D.journal, B = D.bilan, T = D.trous, APRES = D.apres;
// Premier champ renvoyant vrai si une chaîne vaut l'une des options, sinon vide.
const choisi = (v, options) => (options.includes(v) ? v : '');
const chaine = v => (typeof v === 'string' ? v.slice(0, MAX_TEXTE) : '');
const tableau = v => (Array.isArray(v) ? v : []);
const objet = v => (v && typeof v === 'object' ? v : {});

/* ================================================================== */
/* Logique pure (testée en mode ?test)                                 */
/* ================================================================== */

const pad = n => String(n).padStart(2, '0');
const heureDe = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dateDe = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const nomFichier = d => 'chateaux_grille-observation_' + dateDe(d) + '.md';

const ligneJournal = heure => ({ heure: heure || '', phase: '', question: '', onglet: '', trouve: '', temps: '', remarque: '' });
const ligneBilan = () => ({ constat: '', type: '', gravite: '', suite: '' });
const pointVide = p => ({ coche: false, v: (p.champs || []).map(() => '') });

function etatDefaut() {
  return {
    v: 1,
    entete: Object.fromEntries(D.entete.map(e => [e.id, ''])),
    avant: D.avant.points.map(() => ({ coche: false })),
    journal: [],
    trous: T.points.map(() => ({ survenu: '', decision: '' })),
    outils: D.outils.points.map(pointVide),
    lisibilite: D.lisibilite.points.map(pointVide),
    apres: { reponses: APRES.questions.filter(q => !q.note).map(() => ''), note: 0 },
    bilan: []
  };
}

// Tout ce qui n'a pas la forme attendue retombe sur la valeur par défaut.
function normaliserEtat(brut) {
  const e = etatDefaut(), b = objet(brut);
  Object.keys(e.entete).forEach(k => { e.entete[k] = chaine(objet(b.entete)[k]); });
  e.avant.forEach((p, i) => { p.coche = objet(tableau(b.avant)[i]).coche === true; });
  e.journal = tableau(b.journal).slice(0, MAX_LIGNES).map(l => {
    const o = objet(l);
    return {
      heure: chaine(o.heure), phase: chaine(o.phase), question: chaine(o.question),
      onglet: choisi(o.onglet, J.onglets), trouve: choisi(o.trouve, J.trouve), temps: chaine(o.temps), remarque: chaine(o.remarque)
    };
  });
  e.trous.forEach((t, i) => {
    const o = objet(tableau(b.trous)[i]);
    t.survenu = choisi(o.survenu, T.reponses); t.decision = chaine(o.decision);
  });
  ['outils', 'lisibilite'].forEach(cle => {
    D[cle].points.forEach((p, i) => {
      const o = objet(tableau(b[cle])[i]), cible = e[cle][i];
      cible.coche = o.coche === true;
      (p.champs || []).forEach((c, j) => { cible.v[j] = c.choix ? choisi(tableau(o.v)[j], c.choix) : chaine(tableau(o.v)[j]); });
    });
  });
  const ap = objet(b.apres);
  e.apres.reponses = e.apres.reponses.map((_, i) => chaine(tableau(ap.reponses)[i]));
  e.apres.note = Number.isInteger(ap.note) && ap.note >= 1 && ap.note <= 5 ? ap.note : 0;
  e.bilan = tableau(b.bilan).slice(0, MAX_LIGNES).map(l => {
    const o = objet(l);
    return { constat: chaine(o.constat), type: choisi(o.type, B.types), gravite: choisi(o.gravite, B.gravites), suite: chaine(o.suite) };
  });
  return e;
}

// --- Export Markdown : mêmes sections, même ordre, mêmes libellés que le .md d'origine.
const VIDE = '**\\_\\_\\_\\_**';
const gras = v => (String(v).trim() ? '**' + String(v).trim() + '**' : VIDE);
const cellule = v => String(v).replace(/\r?\n/g, ' ').replace(/\|/g, '\\|').trim();
const ligneTableau = cellules => '| ' + cellules.map(cellule).join(' | ') + ' |';
function tableMd(entetes, lignes) {
  const corps = lignes.length ? lignes : [entetes.map(() => '')];
  return [ligneTableau(entetes), ligneTableau(entetes.map(() => '---'))].concat(corps.map(ligneTableau));
}
function pointMd(p, valeurs, coche) {
  const champs = p.champs || [];
  let ligne = p.texte;
  champs.forEach((c, j) => {
    const v = valeurs[j];
    if (c.choix) {
      const rendu = c.choix.map(o => (v && o !== v ? '~~' + o + '~~' : o)).join(' / ');
      ligne += ' ' + rendu + (c.aide ? ' ' + c.aide : '');
    } else {
      ligne += (j ? ' ;' : '') + ' ' + (c.libelle ? c.libelle + ' ' : '') + gras(v);
    }
  });
  const fait = coche === undefined ? champs.some(c => c.choix) && valeurs.some(v => v) : coche;
  return '- [' + (fait ? 'x' : ' ') + '] ' + ligne;
}

function genererExport(e) {
  const L = [];
  L.push('# ' + D.titre, '');
  D.intro.forEach(p => L.push(p));
  L.push('', D.entete.map(c => c.libelle + ' : ' + gras(e.entete[c.id])).join(' '), '', '---', '');

  L.push('## ' + D.avant.titre, '');
  D.avant.points.forEach((p, i) => L.push('- [' + (e.avant[i].coche ? 'x' : ' ') + '] ' + p.texte));

  const C = J.colonnes;
  L.push('', '## ' + J.titre, '', J.intro, '');
  L.push(...tableMd([C.heure, C.phase, C.question, C.onglet, C.trouve, C.temps, C.remarque],
    e.journal.map(l => [l.heure, l.phase, l.question, l.onglet, l.trouve, l.temps, l.remarque])));
  L.push('', J.note);

  L.push('', '## ' + T.titre, '', T.intro, '');
  L.push(...tableMd([T.colonnes.point, T.colonnes.survenu, T.colonnes.decision],
    T.points.map((p, i) => [p, e.trous[i].survenu, e.trous[i].decision])));

  L.push('', '## ' + D.outils.titre, '');
  D.outils.points.forEach((p, i) => L.push(pointMd(p, e.outils[i].v, p.sansCase ? undefined : e.outils[i].coche)));

  L.push('', '## ' + D.lisibilite.titre, '');
  D.lisibilite.points.forEach((p, i) => L.push(pointMd(p, e.lisibilite[i].v, e.lisibilite[i].coche)));

  L.push('', '## ' + APRES.titre, '');
  let r = 0;
  APRES.questions.forEach((q, i) => {
    L.push((i + 1) + '. ' + q.texte);
    L.push('   ' + (q.note ? '**Réponse :** ' + (e.apres.note ? e.apres.note + ' / 5' : VIDE) : '**Réponse :** ' + (e.apres.reponses[r++].replace(/\r?\n/g, ' ').trim() || VIDE)));
  });

  const K = B.colonnes;
  L.push('', '## ' + B.titre, '');
  L.push(...tableMd([K.constat, K.type, K.gravite, K.suite], e.bilan.map(l => [l.constat, l.type, l.gravite, l.suite])));
  return L.join('\n') + '\n';
}

/* ================================================================== */
/* État                                                                */
/* ================================================================== */

function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (brut) {
      const o = JSON.parse(brut);
      if (o && o.v === 1) return normaliserEtat(o);
    }
  } catch (e) { /* stockage vide, illisible ou indisponible : on repart d'une grille neuve */ }
  return etatDefaut();
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* stockage indisponible : la grille reste utilisable en mémoire */ }
}
let etat = charger();

const lire = chemin => chemin.split('.').reduce((o, k) => o[k], etat);
function ecrire(chemin, valeur) {
  const cles = chemin.split('.');
  const dernier = cles.pop();
  cles.reduce((o, k) => o[k], etat)[dernier] = valeur;
}

/* ================================================================== */
/* Outils DOM                                                          */
/* ================================================================== */

function h(tag, attrs, ...enfants) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    e.setAttribute(k, v === true ? '' : v);
  });
  enfants.flat(Infinity).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    e.append(typeof c === 'object' ? c : document.createTextNode(c));
  });
  return e;
}
// **gras** et `code` dans les textes des données
function riche(t) {
  return String(t).split(/(\*\*.+?\*\*|`.+?`)/).map(p => {
    if (/^\*\*.+\*\*$/.test(p)) return h('strong', {}, p.slice(2, -2));
    if (/^`.+`$/.test(p)) return h('code', {}, p.slice(1, -1));
    return p;
  });
}

const choix = (chemin, libelle, options) => h('div', { role: 'group', 'aria-label': libelle },

// `racine` limite la mise à jour à un bloc : une liste reconstruite ne doit pas relire les cartes de l'autre liste,
// dont les indices peuvent ne plus exister dans l'état.
function majChamps(racine) {
  const zone = racine || document;
  zone.querySelectorAll('[data-champ]').forEach(c => {
    if (document.activeElement !== c) c.value = lire(c.dataset.champ);
  });
  zone.querySelectorAll('[data-coche]').forEach(c => { c.checked = lire(c.dataset.coche) === true; });
  zone.querySelectorAll('[data-choix]').forEach(b => {
    b.setAttribute('aria-pressed', String(String(lire(b.dataset.choix)) === b.dataset.valeur));
  });
}
function majNouvelle() {
  const b = document.getElementById('nouvelle');
  b.classList.toggle('confirme', confirmations.nouvelle);
  b.textContent = confirmations.nouvelle ? D.messages.confirmerNouvelle : D.messages.nouvelle;
}
function majSuppressions() {
  document.querySelectorAll('[data-action="supprimer"]').forEach(b => {
    const attente = confirmations.ligne === b.dataset.liste + '.' + b.dataset.i;
    b.classList.toggle('confirme', attente);
    b.textContent = attente ? D.messages.confirmerLigne : D.messages.supprimer;
  });
}
function actualiser() { majChamps(); majNouvelle(); majSuppressions(); }
function valider() { sauver(); majChamps(); }

function ajouterLigne(nom) {
  if (etat[nom].length >= MAX_LIGNES) return;

  confirmations.ligne = '';
  construireListe(nom);
  majSuppressions();
}
function nouvelleGrille() {
  clearTimeout(minuteurNouvelle);
  confirmations.nouvelle = false; confirmations.ligne = '';

document.addEventListener('click', ev => {
  const ch = ev.target.closest('[data-choix]');
  if (ch) {
    const chemin = ch.dataset.choix, valeur = ch.dataset.valeur;
    const numerique = chemin === 'apres.note';
    const actuel = String(lire(chemin));
    ecrire(chemin, actuel === valeur ? (numerique ? 0 : '') : (numerique ? Number(valeur) : valeur));
    valider(); return;
  }
  const act = ev.target.closest('[data-action]');
  if (!act) return;
  const nom = act.dataset.liste, i = Number(act.dataset.i);
  if (act.dataset.action === 'ajouter') ajouterLigne(nom);
  if (act.dataset.action === 'supprimer') {
    const cle = nom + '.' + i;
    if (confirmations.ligne === cle) { clearTimeout(minuteurLigne); supprimerLigne(nom, i); return; }
    confirmations.ligne = cle; majSuppressions();
    clearTimeout(minuteurLigne);
    minuteurLigne = setTimeout(() => { confirmations.ligne = ''; majSuppressions(); }, 4000);
  }
});

document.addEventListener('input', ev => {
  const c = ev.target.closest('[data-champ]');
  if (c) { ecrire(c.dataset.champ, c.value); sauver(); }
});
document.addEventListener('change', ev => {
  const c = ev.target.closest('[data-coche]');
  if (c) { ecrire(c.dataset.coche, c.checked); sauver(); return; }
  const l = ev.target.closest('select[data-champ]');
  if (l) { ecrire(l.dataset.champ, l.value); sauver(); }
});

document.getElementById('nouvelle').addEventListener('click', () => {
  if (confirmations.nouvelle) { nouvelleGrille(); return; }
  confirmations.nouvelle = true; majNouvelle();
  clearTimeout(minuteurNouvelle);
  minuteurNouvelle = setTimeout(() => { confirmations.nouvelle = false; majNouvelle(); }, 4000);
});

/* --- export : copie dans le presse-papiers et téléchargement .md --- */
async function copier(texte) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(texte); return true; }
  } catch (e) { /* refus ou API absente : repli ci-dessous */ }
  try {
    const zone = document.getElementById('texteExport');
    zone.focus(); zone.select();
    return document.execCommand('copy');
  } catch (e) { return false; }
}
function telecharger(texte) {
  const url = URL.createObjectURL(new Blob([texte], { type: 'text/markdown;charset=utf-8' }));
  const a = h('a', { href: url, download: nomFichier(new Date()) });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function exporter() {
  const texte = genererExport(etat);
  const zone = document.getElementById('texteExport');
  zone.value = texte;
  document.getElementById('zoneExport').hidden = false;
  const ok = await copier(texte);
  document.getElementById('statutExport').textContent = ok ? D.messages.copie + ' ' + D.messages.pret : D.messages.copieImpossible;
  if (!ok) { zone.focus(); zone.select(); }
  return ok;
}

  cliquer('[data-action="ajouter"][data-liste="journal"]');
  cliquer('[data-action="supprimer"][data-liste="journal"][data-i="0"]');
  egal('Suppression : un seul appui ne supprime rien', etat.journal.length, 2);
  egal('Suppression : le bouton demande confirmation', qs('[data-action="supprimer"][data-i="0"]').textContent, D.messages.confirmerLigne);
  cliquer('[data-action="supprimer"][data-liste="journal"][data-i="0"]');
  egal('Suppression : le second appui supprime', etat.journal.length + ':' + document.querySelectorAll('#liste-journal .carte').length, '1:1');

  // --- Bilan
  cliquer('[data-action="ajouter"][data-liste="bilan"]');
  saisir('[data-champ="bilan.0.constat"]', 'Bouton trop petit');
  cliquer('[data-choix="bilan.0.type"][data-valeur="interface"]');
  cliquer('[data-choix="bilan.0.gravite"][data-valeur="gênant"]');
  saisir('[data-champ="bilan.0.suite"]', 'agrandir');
  egal('Bilan : ligne saisie', JSON.stringify(etat.bilan[0]), JSON.stringify({ constat: 'Bouton trop petit', type: 'interface', gravite: 'gênant', suite: 'agrandir' }));

  // --- Export : structure et valeurs
  const vide = genererExport(etatDefaut());
  ['# Châteaux de Bourgogne — grille d\'observation, partie test v1', '## 1. Avant de jouer (2 min)', '## 2. Pendant la partie : le journal',
    '## 3. Les trous du livret : sont-ils survenus ?', '## 4. Les outils', '## 5. Lisibilité à table',
    '## 6. Après la partie (5 min, avec l\'autre joueur)', '## 7. Bilan pour la suite (à remplir ensuite avec Claude)'].forEach(t =>
    verif('Export : titre « ' + t.replace(/^#+ /, '').slice(0, 40) + ' »', vide.includes('\n' + t + '\n') || vide.startsWith(t + '\n'), 'absent'));
  verif('Export vide : les 7 sections dans l\'ordre', (() => { const p = [1, 2, 3, 4, 5, 6, 7].map(n => vide.indexOf('\n## ' + n + '. ')); return p.every((x, i) => x > 0 && (i === 0 || x > p[i - 1])); })(), 'ordre');
  egal('Export vide : en-tête avec 4 champs à remplir', (vide.match(/\*\*\\_\\_\\_\\_\*\*/g) || []).length >= 4, true);
  verif('Export vide : les 3 cases du §1 non cochées', (vide.match(/- \[ \] (La page|« Nouvelle|La mise)/g) || []).length === 3, 'cases');
  verif('Export vide : les 8 trous listés', T.points.every(p => vide.includes('| ' + p + ' |')), 'trou manquant');
  verif('Export vide : texte d\'intro, note « Livret » et consigne présents', vide.includes(J.note) && vide.includes(D.intro[1]) && vide.includes(T.intro), 'texte manquant');
  verif('Export vide : tableau du journal avec en-tête et ligne vide', vide.includes('| Heure | Phase / tour | Question qu\'on se posait | Onglet ouvert | Trouvé ? (oui / non / livret) | Temps approx. | Remarque |'), 'en-tête');

  etat = etatDefaut();
  etat.entete = { date: '2026-10-22', joueurs: 'Ana et Léo', tablette: 'Galaxy Tab', duree: '1 h 40' };
  etat.avant[0].coche = true; etat.avant[2].coche = true;
  etat.journal = [{ heure: '14:32', phase: 'B / 3', question: 'Qui prend le dé blanc ?', onglet: 'Tour de jeu', trouve: 'non', temps: '40 s', remarque: 'a | b\nsuite' }];
  etat.trous[2] = { survenu: 'oui', decision: 'Pont relu à chaque tour' }; etat.trous[0].survenu = 'non';
  etat.outils[0] = { coche: true, v: ['tour 3'] }; etat.outils[2] = { coche: true, v: ['7', '1'] }; etat.outils[4] = { coche: false, v: ["il n'a pas servi"] };
  etat.lisibilite[1] = { coche: false, v: ['bouton Retour'] }; etat.lisibilite[4] = { coche: true, v: ['reflets'] };
  etat.apres = { reponses: ['le suivi', 'le départage', 'les égalités'], note: 4 };
  etat.bilan = [{ constat: 'Bouton trop petit', type: 'interface', gravite: 'gênant', suite: 'agrandir' }];
  const plein = genererExport(etat);
  ['2026-10-22', 'Ana et Léo', 'Galaxy Tab', '1 h 40', '14:32', 'B / 3', 'Qui prend le dé blanc ?', 'Tour de jeu', '40 s', 'Pont relu à chaque tour',
    'tour 3', 'bouton Retour', 'reflets', 'le suivi', 'le départage', 'les égalités', 'Bouton trop petit', 'interface', 'gênant', 'agrandir'].forEach(v =>
    verif('Export : valeur « ' + v + ' » reprise', plein.includes(v), 'absente'));
  verif('Export : « 4 / 5 » pour la note', plein.includes('**Réponse :** 4 / 5'), 'note');
  verif('Export : la barre verticale saisie est échappée', plein.includes('a \\| b suite'), 'non échappée');
  verif('Export : la ligne du journal tient sur une seule ligne', plein.split('\n').filter(l => l.startsWith('| 14:32')).length === 1, 'ligne coupée');
  verif('Export : trou n° 3 = oui, n° 1 = non', plein.includes('| Premier joueur d\'un tour (lecture du pont) | oui | Pont relu à chaque tour |') && plein.includes('| Dépôt vide pour le dé choisi | non |'), 'trous');
  verif('Export : cases cochées (§1, §4, §5)', plein.includes('- [x] La page s\'ouvre') && plein.includes('- [ ] « Nouvelle partie »') && plein.includes('- [x] La mise en place')
    && plein.includes('- [x] **Zone (B)** : chaque zone complétée a été comptée avec l\'outil. Nombre de fois : **7** ; erreurs : **1**'), 'cases');
  verif('Export : champ « Sinon, à quel moment… » repris', plein.includes('- [x] **Suivi (A)** : il est resté synchronisé avec la partie réelle jusqu\'à la fin. Sinon, à quel moment a-t-il décroché ? **tour 3**'), 'champ');
  verif('Export : départage, mention inutile rayée', plein.includes('- [x] **Départage** : ~~il a servi~~ / il n\'a pas servi (rayer la mention inutile)'), 'départage');
  verif('Export : départage non renseigné = case vide, rien rayé', vide.includes('- [ ] **Départage** : il a servi / il n\'a pas servi (rayer la mention inutile)'), 'départage vide');
  verif('Export : champ libre sans libellé (lumière, reflets)', plein.includes('- [x] Lumière, reflets, orientation de la tablette : **reflets**'), 'lumière');
  verif('Export : en-tête rempli', plein.includes('Date : **2026-10-22** Joueurs : **Ana et Léo** Tablette : **Galaxy Tab** Durée de la partie : **1 h 40**'), 'en-tête');
  verif('Export : réponse non saisie = champ à remplir', genererExport(etatDefaut()).includes('**Réponse :** ' + VIDE), 'réponse vide');

  // Export par le bouton : le texte affiché est celui de l'état courant
  const etatPourExport = JSON.parse(JSON.stringify(etat));
  sauver(); construireListe('journal'); construireListe('bilan'); actualiser();
  egal('Export : zone masquée avant le bouton', document.getElementById('zoneExport').hidden, true);
  verif('Export : le bouton remplit la zone avec le Markdown de l\'état', (() => { exporter(); return document.getElementById('texteExport').value === genererExport(etatPourExport) && !document.getElementById('zoneExport').hidden; })(), 'texte différent');

  // --- Réinitialisation : « Nouvelle grille »
  cliquer('#nouvelle');
  egal('Nouvelle grille : un seul appui ne change rien', etat.journal.length + ':' + etat.entete.joueurs, '1:Ana et Léo');
  egal('Nouvelle grille : le bouton demande confirmation', qs('#nouvelle').textContent, D.messages.confirmerNouvelle);
  cliquer('#nouvelle');
  suite('Nouvelle grille : état remis à zéro', etat, etatDefaut());
  egal('Nouvelle grille : cartes supprimées', document.querySelectorAll('.carte').length - T.points.length - APRES.questions.length, 0);
  egal('Nouvelle grille : champ vidé', qs('[data-champ="entete.joueurs"]').value, '');
  egal('Nouvelle grille : boutons relâchés', document.querySelectorAll('[aria-pressed="true"]').length, 0);
  egal('Nouvelle grille : sauvegarde effacée', lireStockage(), null);
  egal('Nouvelle grille : export masqué', document.getElementById('zoneExport').hidden, true);
  egal('Nouvelle grille : bouton revenu à son libellé', qs('#nouvelle').textContent, 'Nouvelle grille');

  // --- Interface : téléphone, 44 px, aucune ressource tierce
  egal('Interface : aucun lien ni script tiers', document.querySelectorAll('link[href^="http"], script[src], img[src^="http"]').length, 0);
  cliquer('[data-action="ajouter"][data-liste="journal"]'); cliquer('[data-action="ajouter"][data-liste="bilan"]');
  const trop = [];
  document.querySelectorAll('button, select, textarea, input:not([type=checkbox]), label.coche, #sauts a').forEach(e => {
    const r = e.getBoundingClientRect();
    if (r.width > 0 && (r.height < 43.5 || r.width < 43.5)) trop.push((e.id || e.className || e.tagName) + ' ' + Math.round(r.width) + '×' + Math.round(r.height));
  });
  verif('Tactile : toutes les cibles font au moins 44 px', trop.length === 0, trop.slice(0, 6).join(' ; '));
  verif('Une seule colonne : aucun défilement horizontal', document.documentElement.scrollWidth <= window.innerWidth, document.documentElement.scrollWidth + ' > ' + window.innerWidth);
  verif('Chaque champ a une étiquette', [...document.querySelectorAll('[data-champ]')].every(c => c.closest('label') || c.getAttribute('aria-label')), 'champ sans étiquette');

  // --- Restauration de l'état d'avant les tests
  etat = normaliserEtat(etatAvant);
  try { if (brutAvant === null) localStorage.removeItem(CLE); else localStorage.setItem(CLE, brutAvant); } catch (e) { /* stockage indisponible : rien à restaurer */ }
  construireListe('journal'); construireListe('bilan'); actualiser();
  window.scrollTo({ top: 0 });

  liste.append(h('li', { class: 'info' }, total + ' vérifications.'));
  const zoneTests = document.getElementById('tests');
  zoneTests.hidden = false;
  zoneTests.append(h('strong', { id: 'bilanTests' }, echecs ? echecs + ' test(s) en échec sur ' + total : 'Tous les tests passent (' + total + ')'), liste);
  console.log(echecs ? 'TESTS : ' + echecs + ' échec(s) sur ' + total : 'TESTS : tout passe (' + total + ')');
}

})();
</script>
</body>
</html>
